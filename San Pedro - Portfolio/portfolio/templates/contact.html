<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Send John Paolo San Pedro a message.">
    <title>Contact — John Paolo San Pedro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="page-shell">
        {% include '_sidebar.html' %}

        <main class="main-content">
            <div class="content-wrap contact-wrap">
                <section class="contact-intro" aria-labelledby="contact-title">
                    <p class="eyebrow"><span class="eyebrow-line"></span> GET IN TOUCH</p>
                    <h1 id="contact-title">Send me a message<span class="accent-period">.</span></h1>
                    <p class="intro">
                        Have a question or want to say hello? Send me a message directly using the form below.
                    </p>
                </section>

                <section class="contact-panel" aria-label="Message form">
                    {% if status %}
                    <p class="form-status {{ status_type }}" role="status">{{ status }}</p>
                    {% endif %}
                    <form class="contact-form" action="{{ url_for('main.contact') }}" method="post">
                        <div class="form-row">
                            <label class="form-field">
                                <span>Your name</span>
                                <input type="text" name="name" autocomplete="name" placeholder="Jane Smith" maxlength="120" value="{{ request.form.get('name', '') }}" required>
                            </label>
                            <label class="form-field">
                                <span>Your email</span>
                                <input type="email" name="sender_email" autocomplete="email" placeholder="jane@example.com" maxlength="254" value="{{ request.form.get('sender_email', '') }}" required>
                            </label>
                        </div>
                        <label class="form-field">
                            <span>Subject</span>
                            <input type="text" name="subject" placeholder="What would you like to talk about?" maxlength="200" value="{{ request.form.get('subject', '') }}" required>
                        </label>
                        <label class="form-field">
                            <span>Message</span>
                            <textarea name="message" rows="6" maxlength="10000" placeholder="Write your message here..." required>{{ request.form.get('message', '') }}</textarea>
                        </label>
                        <button class="send-button" type="submit">
                            Send message <span aria-hidden="true">↗</span>
                        </button>
                    </form>
                    <p class="delivery-note">
                        Your message will be sent to
                        <a href="mailto:johnpaolosanpedro19@gmail.com">johnpaolosanpedro19@gmail.com</a>.
                    </p>
                </section>

                <footer class="page-footer">
                    <span>© 2026 JOHN PAOLO SAN PEDRO</span>
                </footer>
            </div>
        </main>
    </div>
</body>
</html>
